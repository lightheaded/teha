# A template only. Every value is a placeholder.
#
# Never commit a real token or a real key. Encrypt the secret with SOPS in the
# private infrastructure repository, or read it from an external secret store.
#
# To create a device token:
#
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: teha
type: Opaque
stringData:
  # The device token that guards every route.
  TEHA_TOKEN: "example-token-replace-me"
  # The Web Push keypair. Make one with: teha -vapid-keys
  # The public key is not a secret. The private key is: whoever holds it can
  # push to every subscribed device. Remove both lines to run with push off.
  TEHA_VAPID_PUBLIC_KEY: "example-public-key-replace-me"
  TEHA_VAPID_PRIVATE_KEY: "example-private-key-replace-me"
  # The Litestream sidecar reads these three names.
  LITESTREAM_ACCESS_KEY_ID: "example-access-key"
  LITESTREAM_SECRET_ACCESS_KEY: "example-secret-key"
  LITESTREAM_ENDPOINT: "https://s3.example.com"
  LITESTREAM_BUCKET: "example-bucket"
  LITESTREAM_PATH: "teha"
