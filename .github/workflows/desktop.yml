# SPDX-License-Identifier: AGPL-3.0-or-later
name: desktop

# A change to the server must not pay for a Rust build, so the paths list names
# the desktop tree and this file, and nothing else. The shell holds no server
# code: it points a window at a running server.
on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A macOS runner, because this shell talks to the keychain, the menu bar
    # and the activation policy. A Linux check would compile a different set of
    # dependencies and prove less.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache the cargo output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Check the shell
        run: cargo check --all-targets

      - name: Run the unit tests
        # The URL parser and the JavaScript escaping carry the tests. Both are
        # what an outside input touches first.
        run: cargo test

# There is no release job on purpose. The macOS build is unsigned in Phase 1,
# and signing and notarization is a Phase 4 decision, because the certificate
# carries a legal name. See docs/PLAN.md section 4.
