<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teha — sign in</title>
<style>
:root{--bg:#f6f7f3;--card:#fff;--ink:#1c221d;--ink-3:#7a827c;--line:#d8dcd2;--accent:#2f6b4f}
@media (prefers-color-scheme:dark){:root{--bg:#131714;--card:#1b201c;--ink:#e7eae4;--ink-3:#7f877f;--line:#2b322c;--accent:#7fc49b}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px;width:min(360px,92vw);display:grid;gap:12px}
h1{margin:0;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
p{margin:0;color:var(--ink-3);font-size:14px}
form{display:grid;gap:12px;margin:0}
input,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--accent);color:var(--bg);border:none;font-weight:600;cursor:pointer}
button.ghost{background:none;color:var(--accent);border:1px solid var(--line);font-weight:600}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:#c8412f;font-size:14px;min-height:1.2em}
[hidden]{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>teha</h1>
  <div id="pk" hidden>
    <button type="button" id="pkBtn">Sign in with a passkey</button>
    <p class="err" id="pkErr"></p>
  </div>
  <div class="or" id="or" hidden>or</div>
  <p>The device token is the fallback. Every native client and the MCP endpoint use it.</p>
  <form method="POST" action="/login">
    <input type="password" name="token" placeholder="Device token" autocomplete="current-password">
    <button type="submit" class="ghost">Sign in with the token</button>
  </form>
  <p class="err" id="err"></p>
</div>
<script type="module" src="/login.js"></script>
</body>
</html>
