<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c221d">
<title>teha</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{
  --bg:#f6f7f3; --bg-2:#eceee6; --card:#fff; --ink:#1c221d; --ink-2:#4b544d; --ink-3:#7a827c;
  --line:#d8dcd2; --accent:#2f6b4f; --accent-ink:#fff; --p1:#c8412f; --p2:#c07a1f; --p3:#2f6b4f;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#131714; --bg-2:#1b201c; --card:#1b201c; --ink:#e7eae4; --ink-2:#b4bab3; --ink-3:#7f877f;
  --line:#2b322c; --accent:#7fc49b; --accent-ink:#0f1a13; --p1:#e8705e; --p2:#d9a94a; --p3:#7fc49b;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:1fr;height:100%}
@media (min-width:800px){.app{grid-template-columns:230px 1fr}}
aside{display:none;border-right:1px solid var(--line);padding:16px 10px;background:var(--bg-2)}
@media (min-width:800px){aside{display:block}}
aside h1{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:4px 8px 14px}
nav a{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:14.5px;cursor:pointer}
nav a:hover{background:var(--card);color:var(--ink)}
nav a.on{background:var(--card);color:var(--ink);font-weight:600}
nav a .c{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:13px}
nav .grp{margin:16px 0 4px;padding:0 9px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
main{display:flex;flex-direction:column;min-width:0;height:100%}
header{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header h2{margin:0;font-size:21px;letter-spacing:-.01em}
header .n{color:var(--ink-3);font-size:14px;font-variant-numeric:tabular-nums}
header .st{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}
.qa{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.qa input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.qa input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.qa .hint{margin-top:6px;font-size:12.5px;color:var(--ink-3);min-height:1.2em}
.qa .hint b{color:var(--accent);font-weight:600}
.list{flex:1;overflow-y:auto;padding:6px 10px 90px}
.row{display:flex;gap:11px;align-items:flex-start;padding:9px 8px;border-radius:8px;cursor:default}
.row.sel{background:var(--bg-2);box-shadow:inset 2px 0 0 var(--accent)}
/* A picked row is tinted and carries a solid bar, so a set of them reads as a
   block at a glance. The cursor row keeps its own thinner bar. */
.row.mk{background:color-mix(in srgb,var(--accent) 13%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.row.mk.sel{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.row .box{flex:none;width:19px;height:19px;margin-top:1px;border:1.6px solid var(--ink-3);border-radius:50%;background:none;cursor:pointer}
.row.p1 .box{border-color:var(--p1)} .row.p2 .box{border-color:var(--p2)} .row.p3 .box{border-color:var(--p3)}
.row .box:hover{background:var(--accent);border-color:var(--accent)}
.row.done .t{text-decoration:line-through;color:var(--ink-3)}
.row .body{min-width:0;flex:1}
.row .t{overflow-wrap:anywhere}
.row .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.row .meta .due.od{color:var(--p1)} .row .meta .due.today{color:var(--accent)}
.row .meta .lb{color:var(--ink-2)}
.row .meta .pr{color:var(--ink-3)}
.empty{padding:44px 12px;text-align:center;color:var(--ink-3)}
.grp-head{position:sticky;top:0;background:var(--bg);padding:12px 8px 5px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);z-index:1;display:flex;align-items:center;gap:8px}
.grp-head:first-child{padding-top:6px}
.grp-head .c{font-variant-numeric:tabular-nums;letter-spacing:0}
.grp-head .resched{margin-left:auto;background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);cursor:pointer}
.grp-head .resched:hover{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.menu-back{position:fixed;inset:0;z-index:30}
.menu{position:fixed;z-index:31;width:240px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.24);display:grid;gap:1px}
.menu button,.menu .pick{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:none;border-radius:6px;padding:8px 10px;font-size:14.5px;text-align:left;cursor:pointer}
.menu button:hover,.menu button:focus-visible,.menu .pick:hover{background:var(--bg-2);outline:none}
.menu .w{color:var(--ink-3);font-size:12.5px}
.menu .pick{border-top:1px solid var(--line);border-radius:0 0 6px 6px;margin-top:4px;padding-top:10px}
.menu .pick input{width:120px;padding:3px 5px;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
/* The bulk bar sits where the toast sits. A bulk action clears the selection,
   so the bar leaves as the toast arrives and the two never stack. */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:20;display:flex;gap:6px;align-items:center;padding:7px 9px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.bulk .n{font-size:13px;color:var(--ink-2);padding:0 6px;font-variant-numeric:tabular-nums}
.bulk button{background:var(--bg-2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.bulk button:hover{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.bulk button.ghost{background:none;border-color:transparent;color:var(--ink-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer}
.fab{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:26px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
@media (min-width:800px){.fab{display:none}}
.keys{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.keys .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-width:420px;width:100%}
.keys h3{margin:0 0 10px;font-size:16px}
.keys dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.keys dt{font-family:var(--mono);color:var(--accent)}
.keys dd{margin:0;color:var(--ink-2)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;z-index:20}
.sheet .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(560px,100%);display:grid;gap:10px}
.sheet input,.sheet textarea,.sheet select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
.sheet input:focus,.sheet textarea:focus,.sheet select:focus{outline:2px solid var(--accent);border-color:transparent}
.sheet .d-title{font-size:18px;font-weight:600}
.sheet textarea{resize:vertical}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.d-grid label{display:grid;gap:3px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.d-row{display:flex;align-items:center;gap:10px}
.d-lab{flex:none;width:74px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.d-prio{display:flex;gap:6px}
.d-prio button{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}
.d-prio button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.d-subs{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.d-sub{font-size:14.5px;color:var(--ink-2);padding-left:2px}
.d-actions{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.d-actions button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 14px;cursor:pointer}
.d-actions .d-del{color:var(--p1);border-color:transparent;background:none;padding-left:0}
.d-actions .d-close{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.d-hint{font-size:12.5px;color:var(--ink-3)}
/* The board layout. A column per section, plus one column for the tasks with
   no section and one field to add a section. The board scrolls sideways and
   the page does not, so a wide account cannot break the layout. */
.lay{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);cursor:pointer}
.lay:hover{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.board{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding:6px 2px 10px}
.col{flex:none;width:272px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:6px}
.col.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg-2))}
.col-head{display:flex;align-items:center;gap:8px;padding:4px 6px 6px}
.col-head[draggable=true]{cursor:grab}
.col-name{background:none;border:none;padding:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;text-align:left;overflow-wrap:anywhere}
.col-name:hover,.col-name:focus-visible{color:var(--accent);outline:none;text-decoration:underline}
.col-name.plain{color:var(--ink-3);cursor:default}
.col-head .c{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.col-body{display:grid;gap:2px;min-height:44px}
.col-body .row{background:var(--card);cursor:grab}
.col-empty{padding:12px 8px;font-size:12.5px;color:var(--ink-3)}
.col.add{background:none;border-style:dashed}
.col-new,.col-rename{width:100%;padding:7px 8px;font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px}
.col-new:focus,.col-rename:focus{outline:2px solid var(--accent);border-color:transparent}
kbd{font-family:var(--mono);font-size:12px;background:var(--bg-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>teha</h1>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header>
      <h2 id="title">Today</h2><span class="n" id="count"></span>
      <button class="lay" id="layout" hidden>Board</button>
      <span class="st" id="status"></span>
    </header>
    <div class="qa">
      <input id="qa" placeholder="Add a task — try: milk tomorrow p1 #Home @store every week" autocomplete="off" spellcheck="false">
      <div class="hint" id="hint">Press <kbd>q</kbd> to focus, <kbd>?</kbd> for keys.</div>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>
<button class="fab" id="fab" aria-label="Add a task">+</button>
<script type="module" src="/app.js"></script>
</body>
</html>
